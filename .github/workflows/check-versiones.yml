name: check-versiones

# Verifica que las versiones estén sincronizadas antes de cada release:
#   - electron/package.json  (fuente de verdad)
#   - extension/manifest.json (lo propaga build_mei/sync-version.js, que vive
#     solo en local porque build_mei/ está en .gitignore; la comprobación aquí
#     compara las versiones directamente con node)
#   - electron/dist/latest.yml (lo genera electron-builder en el build)
#   - el tag vX.Y.Z (cuando se empuja, que es como se dispara cada release)
#
# latest.yml está en .gitignore (solo existe tras un build local), por eso
# esa comprobación es condicional: se omite cuando no hay build en el checkout.

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: package.json ↔ extension/manifest.json
        run: |
          PKG_VERSION=$(node -p "require('./electron/package.json').version")
          MANIFEST_VERSION=$(node -p "require('./extension/manifest.json').version")
          echo "package.json=$PKG_VERSION manifest.json=$MANIFEST_VERSION"
          if [ "$PKG_VERSION" != "$MANIFEST_VERSION" ]; then
            echo "::error::extension/manifest.json ($MANIFEST_VERSION) no coincide con electron/package.json ($PKG_VERSION). Corré localmente: node build_mei/sync-version.js (build_mei/ está en .gitignore)"
            exit 1
          fi
          echo "✓ manifest.json sincronizado con package.json"

      - name: latest.yml (si existe) ↔ package.json
        run: |
          if [ ! -f electron/dist/latest.yml ]; then
            echo "Sin electron/dist/latest.yml en el checkout (está en .gitignore); se omite esta comprobación."
            exit 0
          fi
          LY_VERSION=$(sed -n 's/^version:[[:space:]]*//p' electron/dist/latest.yml | tr -d '[:space:]')
          PKG_VERSION=$(node -p "require('./electron/package.json').version")
          echo "latest.yml version=$LY_VERSION package.json=$PKG_VERSION"
          if [ "$LY_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::latest.yml (${LY_VERSION}) no coincide con electron/package.json (${PKG_VERSION}). Reconstruí con: cd electron && npm run dist"
            exit 1
          fi
          echo "✓ latest.yml sincronizado con package.json"

      - name: icono del instalador (build.win.icon + electron/icon.ico)
        # Sin icono, electron-builder embebe el de Electron por defecto en el
        # .exe y el acceso directo del instalador sale con el átomo gris.
        # El build es local (build_mei/ está en .gitignore), pero esta
        # comprobación garantiza que ninguna release futura regrese al icono
        # por defecto: el .ico debe estar commiteado y bien formado.
        run: |
          ICON=$(node -p "const b=require('./electron/package.json').build||{}; (b.win&&b.win.icon)||''")
          echo "build.win.icon=$ICON"
          if [ "$ICON" != "icon.ico" ]; then
            echo "::error::electron/package.json no define build.win.icon (actual: '$ICON'). Sin él el instalador usa el icono por defecto de Electron."
            exit 1
          fi
          if [ ! -f "electron/$ICON" ]; then
            echo "::error::falta electron/$ICON en el repo (¿se commiteó junto con el fix del icono?)"
            exit 1
          fi
          node -e '
            const fs = require("fs");
            const buf = fs.readFileSync("electron/" + process.argv[1]);
            const res = buf.readUInt16LE(0), tipo = buf.readUInt16LE(2), n = buf.readUInt16LE(4);
            if (res !== 0 || tipo !== 1 || n < 4) throw new Error("cabecera ICO inválida (n=" + n + ")");
            const tams = [];
            for (let i = 0; i < n; i++) tams.push([buf[6 + i * 16], buf[6 + i * 16 + 1]]);
            console.log("tamaños en el .ico:", JSON.stringify(tams));
            if (!tams.some(([w, h]) => w === 0 && h === 0)) throw new Error("el .ico no incluye 256px (w=h=0), que Windows usa para alta densidad/taskbar");
            console.log("✓ electron/icon.ico válido, con 256px");
          ' "$ICON"

      - name: extensión — icono en manifest y popup sin scripts inline (CSP)
        # MV3 bloquea los scripts inline (script-src 'self'): un <script> sin
        # src en el popup deja el badge de versión vacío y el estado clavado en
        # "Conectando…" (bug ya visto). Este paso exige además que manifest.json
        # declare el icono y que cada <script src> referencie un archivo real
        # (evita el bug de popup.html apuntando a popup.js sin commitear) y que
        # la versión del manifest esté sincronizada con package.json en el
        # mismo commit.
        run: |
          node -e '
            const fs = require("fs");
            const AP = String.fromCharCode(39);   // comilla simple
            const DQ = String.fromCharCode(34);   // comilla doble

            // 0) versión sincronizada con package.json en este mismo commit
            const m = JSON.parse(fs.readFileSync("extension/manifest.json", "utf8"));
            const pkg = JSON.parse(fs.readFileSync("electron/package.json", "utf8"));
            if (m.version !== pkg.version) {
              throw new Error("extension/manifest.json (" + m.version + ") no coincide con electron/package.json (" + pkg.version + ") en este commit. Bump primero electron/package.json y corré: node build_mei/sync-version.js");
            }
            console.log("OK version manifest.json=" + m.version + " == package.json=" + pkg.version);
            const icons = m.icons || {};
            for (const t of ["16", "32", "48", "128"]) {
              if (!(t in icons)) throw new Error("extension/manifest.json no declara icons." + t + " (Chrome lo usa para la toolbar y la web store)");
              const ruta = "extension/" + icons[t];
              if (!fs.existsSync(ruta)) throw new Error("icons." + t + " apunta a " + ruta + " pero el archivo no existe");
            }
            if (!m.action || !m.action.default_icon) throw new Error("extension/manifest.json no declara action.default_icon (icono del popup en la toolbar)");
            if (!fs.existsSync("extension/" + m.action.default_icon)) throw new Error("action.default_icon apunta a un archivo inexistente");
            console.log("OK manifest.json: icons 16/32/48/128 y action.default_icon, archivos presentes");

            // 2) popup.html: cero scripts inline (CSP MV3) y externos existentes
            const html = fs.readFileSync("extension/popup.html", "utf8");
            const inline = [];
            const refs = [];
            const re = /<\s*script\b([^>]*)>/gi;
            let mm;
            while ((mm = re.exec(html)) !== null) {
              const src = new RegExp("\\ssrc\\s*=\\s*[" + DQ + AP + "]([^" + DQ + AP + "]*)[" + DQ + AP + "]", "i").exec(mm[1]);
              if (src) refs.push(src[1]);
              else inline.push(mm[0].trim());
            }
            if (inline.length) {
              throw new Error("popup.html tiene scripts inline bloqueados por la CSP de MV3: " + inline.join(", "));
            }
            for (const r of refs) {
              if (!fs.existsSync("extension/" + r)) throw new Error("popup.html referencia extension/" + r + " pero el archivo no existe");
            }
            console.log("OK popup.html: " + refs.length + " script(s) externo(s), 0 inline, todos presentes");
          '

      - name: extensión — popup.js y token.js registrados en el manifest
        # MV3 no tiene campo para los scripts del popup: se declaran en
        # popup.html, que el manifest registra vía action.default_popup. Lo que
        # SÍ debe estar en el manifest es token.js (content_scripts: lo
        # comparten el popup y los content scripts; si se saca, el flujo del
        # token y la sesión exportada se rompe). Además, popup.js NO debe
        # entrar a content_scripts: correría en todas las páginas esperando el
        # DOM del popup y las rompería.
        run: |
          node -e '
            const fs = require("fs");
            const m = JSON.parse(fs.readFileSync("extension/manifest.json", "utf8"));
            const cs = (m.content_scripts || []).map((c) => c.js || []).flat();
            if (!cs.includes("token.js")) {
              throw new Error("token.js no está en content_scripts del manifest (el popup y los content scripts lo usan para el token)");
            }
            if (cs.includes("popup.js")) {
              throw new Error("popup.js NO debe estar en content_scripts: correría en todas las páginas esperando el DOM del popup");
            }
            if (!m.action || m.action.default_popup !== "popup.html") {
              throw new Error("action.default_popup debe ser popup.html (ahí se registran los scripts del popup)");
            }
            const html = fs.readFileSync("extension/popup.html", "utf8");
            const DQ = String.fromCharCode(34), SQ = String.fromCharCode(39);
            const refs = [];
            const re = /<\s*script\b([^>]*)>/gi;
            let mm;
            while ((mm = re.exec(html)) !== null) {
              const src = new RegExp("\\ssrc\\s*=\\s*[" + DQ + SQ + "]([^" + DQ + SQ + "]*)[" + DQ + SQ + "]", "i").exec(mm[1]);
              if (src) refs.push(src[1]);
            }
            for (const s of ["popup.js", "token.js"]) {
              if (!refs.includes(s)) throw new Error("popup.html no carga " + s + " (su registro es popup.html, declarado en action.default_popup)");
            }
            console.log("OK manifest.json: token.js en content_scripts, popup.js fuera de ellos, action.default_popup=popup.html y ambos scripts cargados por el popup");
          '

      - name: tag vX.Y.Z ↔ versión del código
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG=${GITHUB_REF#refs/tags/v}
          PKG_VERSION=$(node -p "require('./electron/package.json').version")
          MANIFEST_VERSION=$(node -p "require('./extension/manifest.json').version")
          echo "tag=$TAG package.json=$PKG_VERSION manifest.json=$MANIFEST_VERSION"
          if [ "$TAG" != "$PKG_VERSION" ] || [ "$TAG" != "$MANIFEST_VERSION" ]; then
            echo "::error::el tag v${TAG} no coincide con las versiones del código (package.json=${PKG_VERSION}, manifest.json=${MANIFEST_VERSION}). Bump primero: electron/package.json + node build_mei/sync-version.js"
            exit 1
          fi
          echo "✓ tag v${TAG} coincide con el código"
